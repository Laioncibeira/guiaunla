name: build y pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas del motor de correlatividades y del grafo
        run: npm test
      - name: Los datos de los planes siguen siendo consistentes
        run: node tools/cotejar-fuente.mjs && node tools/validar-datos.mjs
      - name: Build con las paginas pre-generadas
        run: npm run build
