  <style>
    :host, body { margin: 0; }
    * { box-sizing: border-box; }
    .tel {
      width: 390px; height: 844px; overflow: hidden; position: relative;
      background: #141317; color: #f5f3f7;
      font-family: Archivo, system-ui, sans-serif;
      font-size: 14px; line-height: 1.35; display: flex; flex-direction: column;
    }
    .mono { font-family: 'DM Mono', ui-monospace, monospace; }
    a { color: #c77dff; text-decoration: none; }
    a:hover { opacity: .85; }
    .cab { flex: none; padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
    .cab.linea { border-bottom: 1px solid #35313c; }
    .cab h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
    .cab .sub { margin: 2px 0 0; font-size: 11.5px; color: #a79db0; }
    .atras {
      width: 32px; height: 32px; flex: none; display: grid; place-items: center;
      border: 1px solid #35313c; border-radius: 9px; background: #1d1b21; color: #a79db0;
    }
    .cuerpo { flex: 1; overflow: hidden; padding: 0 16px 8px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1d1b21; border: 1px solid #35313c; border-radius: 12px; padding: 13px 14px; }
    .rot { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #8e8598; }
    .nav {
      flex: none; display: grid; grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid #35313c; background: #1d1b21; padding: 7px 4px 18px;
    }
    .nav div { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8e8598; font-size: 9.5px; min-height: 48px; justify-content: center; }
    .nav div.on { color: #c77dff; }
    .nav svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .hoja {
      flex: none; background: #1d1b21; border-top: 1px solid #35313c;
      border-radius: 18px 18px 0 0; padding: 10px 16px 14px; box-shadow: 0 -12px 28px rgba(0,0,0,.45);
    }
    .tirador { width: 38px; height: 4px; border-radius: 2px; background: #35313c; margin: 0 auto 12px; }
</style>
